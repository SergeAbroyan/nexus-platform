name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - production
      operation:
        description: Terraform operation to run
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

concurrency:
  group: infrastructure-${{ inputs.environment }}-deployment
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"

jobs:
  deploy:
    name: ${{ inputs.operation }} ${{ inputs.environment }} infrastructure
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_INFRASTRUCTURE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      - name: Install Terragrunt
        uses: gruntwork-io/terragrunt-action@8c1d96b76d445fd2e41475a3f0b63dcd1d9cc077 # v3
        with:
          tg_version: 1.2.1
          tf_path: terraform

      - name: Plan infrastructure
        if: inputs.operation == 'plan'
        run: terragrunt run --all plan --non-interactive --working-dir "infrastructure/live/${{ inputs.environment }}"

      - name: Apply infrastructure
        if: inputs.operation == 'apply'
        run: terragrunt run --all apply --non-interactive --working-dir "infrastructure/live/${{ inputs.environment }}"
