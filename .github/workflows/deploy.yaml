name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation to run
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

concurrency:
  group: infrastructure-dev-deployment
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  EKS_PUBLIC_ACCESS_CIDR: ${{ vars.EKS_PUBLIC_ACCESS_CIDR }}
  TF_IN_AUTOMATION: "true"

jobs:
  deploy:
    name: ${{ inputs.operation }} DEV infrastructure
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_INFRASTRUCTURE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: Install Terragrunt
        uses: gruntwork-io/terragrunt-action@8c1d96b76d445fd2e41475a3f0b63dcd1d9cc077 # v3
        with:
          tg_version: 1.1.5
          tf_path: terraform

      - name: Allow this runner to reach the EKS API
        run: echo "CI_RUNNER_PUBLIC_ACCESS_CIDR=$(curl -fsS https://checkip.amazonaws.com)/32" >> "$GITHUB_ENV"

      - name: Check deployment prerequisites
        run: make preflight

      - name: Plan infrastructure
        if: inputs.operation == 'plan'
        run: terragrunt run --all plan --non-interactive --working-dir infrastructure/live/dev/us-east-1

      - name: Apply infrastructure
        if: inputs.operation == 'apply'
        run: terragrunt run --all apply --non-interactive --working-dir infrastructure/live/dev/us-east-1
