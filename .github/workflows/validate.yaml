name: Validate Infrastructure

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: infrastructure-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform and Terragrunt checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: Install Terragrunt
        uses: gruntwork-io/terragrunt-action@8c1d96b76d445fd2e41475a3f0b63dcd1d9cc077 # v3
        with:
          tg_version: 1.1.5
          tf_path: terraform

      - name: Check formatting
        run: |
          terraform fmt -check -recursive infrastructure
          terragrunt hcl fmt --check

      - name: Validate Terragrunt configuration
        run: terragrunt hcl validate --working-dir infrastructure/live

      - name: Validate every Terraform module
        run: |
          for module in infrastructure/modules/*/; do
            echo "Validating ${module}"
            terraform -chdir="${module}" init -backend=false -input=false > /dev/null
            terraform -chdir="${module}" validate
          done

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6
        with:
          tflint_version: v0.64.0

      - name: Lint every Terraform module
        run: |
          for module in infrastructure/modules/*; do
            echo "Linting ${module}"
            tflint --chdir="${module}"
          done

  checkov:
    name: Checkov security scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Enforce project Terraform checks
        uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895 # v12
        with:
          directory: infrastructure
          framework: terraform
          output_format: cli
          quiet: true
          # Registry modules use exact versions; commit hashes apply to Git sources.
          skip_check: CKV_TF_1
          soft_fail: false

      - name: Audit downloaded external modules
        uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895 # v12
        with:
          directory: infrastructure
          framework: terraform
          download_external_modules: true
          output_format: cli
          quiet: true
          skip_check: CKV_TF_1
          # Upstream packages contain inactive resources that Checkov cannot
          # evaluate through module count/for_each expressions reliably.
          soft_fail: true
