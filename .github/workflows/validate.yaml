name: Validate Infrastructure

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: infrastructure-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform and Terragrunt checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false

      - name: Install Terragrunt
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_version: 1.1.5
          tf_path: terraform

      - name: Check formatting and Terragrunt configuration
        run: make check

      - name: Validate every Terraform module
        run: make validate-modules

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0

      - name: Lint every Terraform module
        run: |
          for module in infrastructure/modules/*; do
            echo "Linting ${module}"
            tflint --chdir="${module}"
          done

  checkov:
    name: Checkov security scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Scan Terraform configuration
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure
          framework: terraform
          output_format: cli
          quiet: true
          # Registry modules use exact versions; commit hashes apply to Git sources.
          skip_check: CKV_TF_1
          soft_fail: false
