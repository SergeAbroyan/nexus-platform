name: Validate Infrastructure

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: infrastructure-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Scan for leaked secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Scan the history with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  terraform:
    name: Terraform and Terragrunt checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      - name: Install Terragrunt
        uses: gruntwork-io/terragrunt-action@8c1d96b76d445fd2e41475a3f0b63dcd1d9cc077 # v3
        with:
          tg_version: 1.2.1
          tf_path: terraform

      - name: Check formatting
        run: |
          terraform fmt -check -recursive infrastructure
          terragrunt hcl fmt --check

      - name: Validate Terragrunt configuration
        run: terragrunt hcl validate --working-dir infrastructure/live

      - name: Validate every Terraform module
        run: |
          for module in infrastructure/modules/*/; do
            echo "Validating ${module}"
            terraform -chdir="${module}" init -backend=false -input=false > /dev/null
            terraform -chdir="${module}" validate
          done

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6
        with:
          tflint_version: v0.65.0

      - name: Lint every Terraform module
        run: |
          for module in infrastructure/modules/*; do
            echo "Linting ${module}"
            tflint --chdir="${module}"
          done

  checkov:
    name: Checkov security scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enforce project Terraform checks
        uses: bridgecrewio/checkov-action@c3e106d5f8f4253a6de5110efb41a080f83db294 # v12
        with:
          directory: infrastructure
          skip_path: infrastructure/live
          framework: terraform
          output_format: cli
          quiet: true
          skip_check: CKV_TF_1,CKV2_AWS_3
          soft_fail: false

      - name: Audit downloaded external modules
        uses: bridgecrewio/checkov-action@c3e106d5f8f4253a6de5110efb41a080f83db294 # v12
        with:
          directory: infrastructure
          skip_path: infrastructure/live
          framework: terraform
          download_external_modules: true
          output_format: cli
          quiet: true
          skip_check: CKV_TF_1,CKV2_AWS_3
          soft_fail: true
