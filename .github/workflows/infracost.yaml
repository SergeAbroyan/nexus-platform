name: Cost estimate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: infracost-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  infracost:
    name: Estimate the monthly cost change
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
    steps:
      - name: Record skipped estimate
        if: env.INFRACOST_API_KEY == ''
        run: echo "Cost estimate skipped because the INFRACOST_API_KEY secret is not configured." >> "${GITHUB_STEP_SUMMARY}"

      - name: Check out the pull request
        if: env.INFRACOST_API_KEY != '' && github.event.action != 'closed'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: head

      - name: Check out the base branch
        if: env.INFRACOST_API_KEY != '' && github.event.action != 'closed'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base

      - name: Compare the cost of both branches
        if: env.INFRACOST_API_KEY != ''
        uses: infracost/actions/diff@a5783eb98adc93aa7a0049fce0abb06fdd30770a # v5.0.1
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          base-path: base
          head-path: head
